name: iosApp
options:
  bundleIdPrefix: com.vocabloot.assetdropkit
  deploymentTarget:
    iOS: "17.0"
packages:
  AssetDropKit:
    path: ../..
targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
      # The demo pack, tagged for On-Demand Resources (iOS 17 and 18). The same folder is
      # archived with scripts/apple-hosted-pack.sh for Apple hosting (iOS 26 and later).
      - path: ../demo-pack/src/main/assets/demo
        type: folder
        buildPhase: resources
        resourceTags: [demo]
    dependencies:
      - package: AssetDropKit
      - target: DemoDownloader
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vocabloot.assetdropkit.sample
        CODE_SIGN_ENTITLEMENTS: iosApp/iosApp.entitlements
        DEVELOPMENT_TEAM: ""   # set your team id
        ENABLE_ON_DEMAND_RESOURCES: YES
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS: $(inherited) -framework ComposeApp
        INFOPLIST_FILE: iosApp/Info.plist
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
      configs:
        # Debug installs outside Xcode keep the tagged pack in the app so ODR still resolves.
        Debug:
          EMBED_ASSET_PACKS_IN_PRODUCT_BUNDLE: YES
    preBuildScripts:
      - name: Compile Kotlin Framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/../.."
          ./gradlew :sample:shared:embedAndSignAppleFrameworkForXcode
  # Apple-hosted packs (iOS 26 and later): the managed downloader the system runs.
  DemoDownloader:
    type: extensionkit-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources: [DemoDownloader]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vocabloot.assetdropkit.sample.downloader
        CODE_SIGN_ENTITLEMENTS: DemoDownloader/DemoDownloader.entitlements
        DEVELOPMENT_TEAM: ""
        INFOPLIST_FILE: DemoDownloader/Info.plist
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
