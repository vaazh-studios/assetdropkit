name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, host tests, simulator tests, API check
        run: ./gradlew :assetdropkit:build :assetdropkit:testAndroidHostTest :assetdropkit:iosSimulatorArm64Test :assetdropkit:apiCheck :assetdropkit-test:apiCheck --no-daemon
      - name: Swift package tests (iOS simulator)
        run: |
          SIM=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          xcodebuild test -scheme AssetDropKit -destination "id=$SIM" -quiet
